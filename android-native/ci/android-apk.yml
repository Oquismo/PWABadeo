name: Compilar APK Android (nativa)

on:
  push:
    branches: [main]
    paths:
      - "android-native/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-native
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK debug y release
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: mi-erasmus-apk
          path: |
            android-native/app/build/outputs/apk/debug/app-debug.apk
            android-native/app/build/outputs/apk/release/app-release.apk
